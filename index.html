<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="images/calculator.jpeg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div
      class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-500 via-indigo-500 to-blue-500 p-6"
    >
      <div
        class="w-full max-w-sm bg-white/20 backdrop-blur-lg border border-white/30 shadow-2xl rounded-2xl p-6"
      >
        <!-- calculator display -->
        <div>
          <input
            type="text"
            id="input"
            class="w-full py-4 mb-5 rounded-xl text-right text-2xl font-sembold border border-gray-300 bg-white/80 outline-none focus:ring-4 focus:ring-purple-400 focus:border-purple-400 shadow-inner"
            placeholder="0"
            readonly
          />
        </div>
        <!-- calculator buttons -->
        <div class="flex flex-col space-y-3">
          <!-- row 1 -->
          <div class="grid grid-cols-4 gap-2">
            <button
              class="transition-all bg-gradient-to-b from-purple-300 to-purple-400 hover:from-purple-400 hover:to-purple-500 active:scale-95 text-gray-800 font-bold py-3 rounded-xl shadow"
              onclick="deleteOp(this)"
            >
              DEL
            </button>
            <button
              class="transition-all bg-gradient-to-b from-purple-300 to-purple-400 hover:from-purple-400 hover:to-purple-500 active:scale-95 text-gray-800 font-bold py-3 rounded-xl shadow"
              onclick="clearOp(this)"
            >
              AC
            </button>
            <button
              class="transition-all bg-gradient-to-b from-purple-300 to-purple-400 hover:from-purple-400 hover:to-purple-500 active:scale-95 text-gray-800 font-bold py-3 rounded-xl shadow"
              onclick="operator(this)"
            >
              %
            </button>
            <button
              class="transition-all bg-gradient-to-b from-purple-300 to-purple-400 hover:from-purple-400 hover:to-purple-500 active:scale-95 text-gray-800 font-bold py-3 rounded-xl shadpw"
              onclick="operator(this)"
            >
              /
            </button>
          </div>
          <!-- row 2 -->
          <div class="grid grid-cols-4 gap-3">
            <button
              class="bg-white hover:bg-purple-100 acive:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              7
            </button>
            <button
              class="bg-white hover:bg-purple-100 acive:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              8
            </button>
            <button
              class="bg-white hover:bg-purple-100 acive:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              9
            </button>
            <button
              class="bg-gradient-to-b from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 acive:scale-95 text-white font-bold py-3 rounded-xl shadow"
              onclick="operator(this)"
            >
              *
            </button>
          </div>
          <!-- row 3 -->
          <div class="grid grid-cols-4 gap-3">
            <button
              class="bg-white hover:bg-purple-100 active:scale transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              4
            </button>
            <button
              class="bg-white hover:bg-purple-100 active:scale transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              5
            </button>
            <button
              class="bg-white hover:bg-purple-100 active:scale transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              6
            </button>
            <button
              class="bg-gradient-to-b from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow"
              onclick="operator(this)"
            >
              -
            </button>
          </div>
          <!-- row 4 -->
          <div class="grid grid-cols-4 gap-3">
            <button
              class="bg-white hover:bg-purple-100 active:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              1
            </button>
            <button
              class="bg-white hover:bg-purple-100 active:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              2
            </button>
            <button
              class="bg-white hover:bg-purple-100 active:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              3
            </button>
            <button
              class="bg-gradient-to-b from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg"
              onclick="operator(this)"
            >
              +
            </button>
          </div>
          <!-- row 5 -->
          <div class="grid grid-cols-4 gap-3">
            <button
              class="col-span-2 bg-white hover:bg-purple-100 active:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              0
            </button>
            <button
              class="bg-white hover:bg-purple-100 active:scale-95 transition-all font-bold py-3 rounded-xl shadow"
              onclick="element(this)"
            >
              .
            </button>
            <button
              class="bg-gradient-to-b from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg"
              onclick="result(this)"
            >
              =
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
